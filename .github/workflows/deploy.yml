name: Publish site

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload the site to Satcom
        env:
          PLESK_PASSWORD: ${{ secrets.PLESK_PASSWORD }}
        run: node scripts/deploy-plesk.mjs
